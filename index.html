<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>この子、どんな子？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
body {
  background-color: #f5f2eb;
  padding: 24px;
  font-family: sans-serif;
}
    .cat-card {
  background-color: white;
  padding: 16px;
  margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      font-family: "Zen Maru Gothic", sans-serif;
}
    .cat-card img {
  border-radius: 10px;
      max-width: 100%;

}
    #cats {
  display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
}
    h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-align: center;
  font-family: "Zen Maru Gothic", sans-serif;
}
    .filter-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
}
    @media (max-width: 600px) {
  .filter-area {
    flex-direction: column;
    gap: 8px;
  }
}
    #pattern {
  font-family: "Zen Maru Gothic", sans-serif;
  font-size: 15px;
  padding: 8px 32px 8px 14px;
  border: 1px solid #d8d4cc;
  border-radius: 20px;
  background-color: white;
}
</style>
</head>

<body>
  <h1>この子、どんな子？</h1>
  <div class="filter-area">
<label for="pattern">何色？：</label>

<select id="pattern">
  <option value="all">すべて</option>
  <option value="キジトラ">キジトラ</option>
  <option value="キジ白">キジ白</option>
  <option value="三毛">三毛</option>
  <option value="サビ">サビ</option>
  <option value="白黒">白黒</option>
  <option value="黒">黒</option>
  <option value="白">白</option>
  <option value="茶トラ">茶トラ</option>
  <option value="茶白">茶白</option>
  <option value="その他">その他</option>
</select>
    </div>
  <div id="cats">猫たちを呼んでいます...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzW8f5C6udDtnsFlnmUIitDnEZSi_VmRvvh1fua50oD-UPZIbNpLArBgWOC1bZK5HeBsA/exec";
    let allCats = [];
    function showCats(cats) {
  const area = document.getElementById("cats");
  area.innerHTML = "";

  cats.forEach(cat => {
    area.innerHTML += `
      <div class="cat-card">
        <img src="${cat.photo}" width="300">
        <h2>${cat.name}</h2>
        <p>${cat.pattern}</p>
        <p>${cat.comment}</p>
      </div>
    `;
  });
}
    fetch(API_URL)
      .then(response => response.json())
      .then(cats => {
        allCats = cats;
       showCats(cats);
      });
    document.getElementById("pattern").addEventListener("change", function() {
  const selectedPattern = this.value;

  if (selectedPattern === "all") {
showCats(allCats);
  } else {
showCats(allCats.filter(cat => cat.pattern === selectedPattern));
  }
});
  </script>
</body>
</html>
